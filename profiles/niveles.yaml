# ============================================================================
# Concilio MoE POR NIVELES y POR TURNOS
# ============================================================================
# Un modelo a la vez. Cada uno lee lo que dejaron los anteriores, decide PASO o
# REFINO, y puntúa su confianza. El nivel sube al Juez cuando la media alcanza
# el umbral; si tras recorrer a todos no llega, se ESCALA al nivel siguiente.
#
# ────────────────────────────────────────────────────────────────────────────
# PRESUPUESTO DE MEMORIA — medido el 2026-09-24, no estimado
# ────────────────────────────────────────────────────────────────────────────
# La versión anterior de este archivo dimensionaba los niveles con `free` de
# WSL. Ollama corre en el host Windows y esa herramienta NO VE su memoria:
# decía «7,9 G totales, ~5,5 G disponibles» cuando el host tiene 11,71 GiB.
# Medido con Win32_OperatingSystem durante una corrida real:
#
#   host total          11,71 GiB
#     Windows            2,02
#     WSL (Sentinel)     1,95     de 7,75 asignados
#     Ollama             7,28     concilio-medium a ctx 16.384
#     libre              0,46
#
# TECHO ÚTIL PARA UN MODELO, con Sentinel Omega corriendo: ~7,3 GiB.
# Con margen de trabajo: 6,8 GiB. Deteniendo Sentinel: ~9,2 GiB.
#
# Y el segundo error, más grave: el techo se escribía como el PESO del modelo.
# La huella real es peso + caché KV, y la caché escala LINEAL con la ventana:
#
#   caché KV = 2 (K y V) × capas × kv_heads × head_dim × ctx × 2 bytes (f16)
#
# Para deepseek-r1:8b a 131.072 eso son 18 GiB de caché sobre 4,87 de peso.
# Medido antes de acotar num_ctx: 23,93 GiB. La caché pesa CUATRO VECES el
# modelo. Por eso `ctx` en cada turno es ahora la ventana ASIGNADA, nunca el
# máximo del modelo — la versión anterior pedía 131.072 en catorce sitios.
# Once de esos catorce exceden el host de calle (llama3.2 a 131k son 16,7 GiB;
# deepseek-r1:8b, 24,0). Los otros tres eran gemma3, y ahí la fórmula plena
# MIENTE: ver la nota de sliding_window más abajo.
#
# El cálculo se valida contra tres medidas de /api/ps con error ≤2,6%:
#   llama3.2:3b    @16.384   calc  3,81   medido  3,80
#   deepseek-r1:8b @16.384   calc  7,47   medido  7,28
#   deepseek-r1:8b @131.072  calc 24,01   medido 23,93
#
# OJO al derivar head_dim: no siempre es embedding_length/head_count. gemma3
# declara key_length=256 mientras esa división da 320. Se usa el DECLARADO.
#
# Y OJO CON gemma3 EN GENERAL: lleva sliding_window=1024, así que la mayoría de
# sus capas atienden sólo una ventana local y la fórmula plena lo sobreestima
# muchísimo. Medido contra calculado a ctx 16.384:
#
#   calculado  5,5 GiB        medido  3,57 GiB     (caché real = 13% de la plena)
#
# Consecuencia: gemma3 es MUCHO más barato de lo que parece y probablemente
# admita una ventana bastante mayor que los 16.384 asignados aquí. No se le
# sube todavía porque el 13% está calibrado con UN SOLO PUNTO; hace falta
# medirlo a 32.768 y a 131.072 antes de tocarlo.
#
# ────────────────────────────────────────────────────────────────────────────
# ORDEN DENTRO DE CADA NIVEL: del más débil al más fuerte, a propósito. La
# deliberación secuencial sufre anclaje --- el primero fija el marco y los demás
# refinan dentro de él. Con el débil primero, el marco nace tentativo y el
# modelo capaz entra con licencia para romperlo. Al revés, el mejor habla
# primero y los otros asienten.
#
# TECHO DE RAM DEL NIVEL = la huella del modelo MAYOR, no la suma: los turnos
# son secuenciales y sólo hay un modelo cargado a la vez. Eso es lo que hace
# viable un nivel que en un ensemble concurrente sería imposible.
#
# Ventanas, tool-calling y parámetros de arquitectura leídos de /api/show el
# 2026-09-24, no del manual.
# ============================================================================

ollama:
  host: http://127.0.0.1:11434
  timeout_seconds: 600          # deepseek-r1:14b razona largo con pack inyectado

consenso:
  umbral_nivel: 85              # media de puntuaciones para subir al Juez
  umbral_juez: 85               # el Juez aprueba a partir de aquí
  max_turnos_por_nivel: 2       # vueltas completas antes de escalar
  max_rondas_juez: 2            # devoluciones antes de escalar al juez avanzado

memoria:
  store: data/moe_turnos.jsonl
  # Cuántos turnos previos ve cada modelo al entrar. Cada entrada lleva el
  # BORRADOR, no solo el marcador --- sin el borrador no hay refinamiento posible.
  turnos_visibles: 6

capitan:
  model: llama3.2:3b
  temperature: 0.0
  # ERA nemotron-mini. Cambiado el 2026-09-24 por decisión del operador:
  # nemotron-mini se reserva SOLO para el portero, que es donde su velocidad
  # rinde, y no participa en ninguna otra tarea mientras no lo probemos.
  #
  # Y las cifras medidas hoy respaldan el cambio en los tres ejes:
  #
  #                   peso   huella@4096   ventana nativa
  #   nemotron-mini   2,51      3,2 GiB          4.096
  #   llama3.2:3b     1,88      2,4 GiB        131.072
  #
  # llama3.2:3b es MÁS PEQUEÑO, ocupa 0,8 GiB menos y tiene 32 veces más
  # ventana. Sus 2,4 GiB lo dejan al borde de caber entero en la VRAM de 4 GiB,
  # que es la diferencia entre segundos y minutos.
  #
  # Y un ahorro que no es cosmético: llama3.2:3b es también el explorador del
  # primer turno de investigación, así que capitán y primer turno son el MISMO
  # modelo y se ahorra un intercambio. Medido en la corrida de las 19:01,
  # cambiar de modelo fue 6m30 de 20m07 --- el 32% del tiempo total.
  #
  # Lo que NO está medido es si razona mejor que nemotron-mini para clasificar.
  # Hay que probarlo antes de afirmarlo.
  #
  # Su trabajo sigue siendo DECIDIR, no razonar: leer el enunciado y devolver
  # un área y un nivel de entrada. Nada de cadenas de pensamiento.
  #
  # Se usa decodificación restringida (Ollama `format`) para que devuelva la
  # etiqueta y ya, en vez de confiar en que obedezca "responde SOLO con...".
  max_tokens: 64

# ---------------------------------------------------------------------------
# INVESTIGACIÓN
# ---------------------------------------------------------------------------
investigacion:
  ligero:
    techo_ram_gb: 3.8    # llama3.2:3b @16384; gemma3:4b mide 3,57 medido
    turnos:
      # nemotron-mini ya NO entra aquí. Estaba de "explorador" y ese rol pide
      # justo lo que no es: rastrear, razonar, sostener contexto largo. Su
      # sitio es decidir rápido --- ver `capitan` y `portero`.
      - {model: llama3.2:3b, rol: explorador, tools: readonly, ctx: 16384}
      - {model: gemma3:4b,   rol: sintetizador, tools: none, ctx: 16384}
  intermedio:
    techo_ram_gb: 6.4    # mistral:7b @16384
    turnos:
      - {model: llama3.2:3b,  rol: explorador, tools: readonly, ctx: 16384}
      - {model: mistral:7b,   rol: contrastador, tools: readonly, ctx: 16384}
      - {model: gemma3:4b,    rol: sintetizador, tools: none, ctx: 16384}
      # gemma3 NO tiene tool-calling (verificado): entra al final, cuando ya
      # solo hay que razonar sobre lo que los otros verificaron.
  avanzado:
    techo_ram_gb: 6.9    # deepseek-r1:8b @12288
    turnos:
      - {model: llama3.2:3b,    rol: explorador, tools: readonly, ctx: 16384}
      - {model: mistral:7b,     rol: contrastador, tools: readonly, ctx: 16384}
      - {model: deepseek-r1:8b, rol: experto, tools: readonly, ctx: 12288}

# ---------------------------------------------------------------------------
# CÓDIGO
# ---------------------------------------------------------------------------
codigo:
  ligero:
    techo_ram_gb: 6.4    # qwen2.5-coder:7b @32768
    turnos:
      - {model: llama3.2:3b,        rol: esbozo, tools: readonly, ctx: 16384}
      - {model: "qwen2.5-coder:7b", rol: programador, tools: readonly, ctx: 32768}
  intermedio:
    techo_ram_gb: 6.9    # deepseek-r1:8b @12288
    turnos:
      - {model: "qwen2.5-coder:7b", rol: programador, tools: readonly, ctx: 32768}
      - {model: deepseek-r1:8b,     rol: revisor, tools: readonly, ctx: 12288}
  avanzado:
    techo_ram_gb: 6.9    # deepseek-r1:8b @12288
    turnos:
      - {model: llama3.2:3b,        rol: esbozo, tools: readonly, ctx: 16384}
      - {model: "qwen2.5-coder:7b", rol: programador, tools: readonly, ctx: 32768}
      - {model: deepseek-r1:8b,     rol: experto, tools: readonly, ctx: 12288}

# ---------------------------------------------------------------------------
# JUEZ — audita el trabajo conjunto del MoE que haya intervenido
# ---------------------------------------------------------------------------
juez:
  normal:
    model: gemma3:4b            # auditar texto YA DADO no pide ventana enorme
    ctx: 16384                  # huella 3,57 GiB MEDIDA (no 5,5 calculada)
    temperature: 0.1
  escalado:
    model: deepseek-r1:8b       # cuando el normal no decide en max_rondas_juez
    ctx: 12288                  # huella 6,9 GiB --- al filo del margen
    temperature: 0.1

# ---------------------------------------------------------------------------
# PORTERO — decide entre turnos, no delibera
# ---------------------------------------------------------------------------
# Tras cada turno alguien tiene que responder una pregunta binaria: ¿esto ya
# está, o hace falta otra vuelta? Ponerla en manos de un razonador es caro y
# lento --- el coder tardó 30 min en su etapa. Esta decisión debe costar
# segundos.
#
# nemotron-mini encaja exactamente: lee el borrador y las puntuaciones de los
# turnos previos y devuelve PASO o REFINO. No produce contenido, no razona en
# cadena, no necesita ventana grande. Solo tiene que ser rápido y no perder el
# hilo de lo que ya se dijo.
#
# Si el portero duda (devuelve algo que no es una de las dos etiquetas) se
# asume REFINO: equivocarse hacia otra vuelta cuesta tiempo; equivocarse hacia
# PASO entrega trabajo sin revisar.
portero:
  model: nemotron-mini
  temperature: 0.0
  max_tokens: 128
  contexto_tokens: 1200     # borrador del turno + puntuaciones previas
  ante_la_duda: REFINO

# ---------------------------------------------------------------------------
# ESCALADO DE CONTEXTO — cuánto material recibe cada turno
# ---------------------------------------------------------------------------
# El contexto de un turno son dos cosas distintas:
#
#   a) MATERIAL recuperado (fragmentos del índice vectorial). Se DOSIFICA.
#   b) ACUMULADO de los turnos previos (borradores + objeciones). Siempre va
#      entero: sin él no hay refinamiento, solo repetición.
#
# El acumulado crece turno a turno, así que los turnos tardíos necesitan más
# sitio. Eso refuerza el orden débil→fuerte por una segunda razón, además del
# anclaje: el último ve TODO y es quien más ventana debe tener.
#
# MÁS CONTEXTO NO ES MEJOR. El tope de cada escalón es por utilidad, no por
# capacidad: gemma3 admite 131k, pero darle 16k útiles rinde más que 100k donde
# lo importante queda sepultado a mitad (los modelos largos atienden peor el
# centro que los extremos). Y cada token cuesta tiempo --- medido: el coder
# tardó 18 min con ~4.800 tokens.
#
# ES UN FILTRO, NO UNA ACUMULACIÓN. Cada turno destila lo que recibió: el
# siguiente recibe la destilación del anterior MÁS fragmentos nuevos solo de lo
# que quedó sin resolver. Por eso el material nuevo BAJA mientras el acumulado
# sube --- si ambos crecieran, el último turno se ahogaría.
escalado_contexto:
  # ventana ASIGNADA -> presupuesto de MATERIAL nuevo, en tokens.
  #
  # Antes esta tabla indexaba por la ventana MÁXIMA del modelo, que es una
  # propiedad del modelo y no del turno: con 131.072 como clave, llama3.2 y
  # deepseek-r1 caían en el mismo escalón de 16.000 tokens aunque el nivel les
  # asigne ventanas distintas. Ahora la clave es el `ctx` que el turno pide de
  # verdad, que es lo único que acota el sitio disponible.
  #
  # El presupuesto sale de: ventana × (1 − reserva_para_generacion) = sitio de
  # entrada, del que el MATERIAL nuevo se lleva un tercio y el ACUMULADO el
  # resto. El acumulado manda porque sin él no hay refinamiento.
  por_ventana:
    4096:   1200      # nemotron-mini (portero): ya filtrado
    2048:    600      # el capitán clasifica; no necesita más
    12288:  3000      # deepseek-r1:8b --- el experto es quien MENOS sitio tiene
    16384:  4000      # llama3.2, gemma3, mistral
    24576:  6000      # deepseek-r1:8b en el perfil `maximo` (Sentinel parado)
    32768:  8000      # qwen2.5-coder

  # Multiplicador por posición en el turno. El primero explora en ancho; los
  # siguientes reciben menos material NUEVO porque heredan lo ya destilado.
  por_turno:
    1: 1.00
    2: 0.60
    3: 0.35

  # El acumulado nunca se recorta por presupuesto: si no cabe, se DEGRADA el
  # material nuevo antes que perder lo que dijeron los compañeros. Si aun así
  # no entra, se sube de nivel (modelo con más ventana) en vez de truncar.
  # REGLA DE ORDEN --- dos criterios, y cuando chocan manda el segundo:
  #
  #   1. Del más DÉBIL al más fuerte (contra el anclaje): el marco inicial debe
  #      nacer tentativo para que el modelo capaz tenga licencia para romperlo.
  #   2. De ventana ESTRECHA a ventana ANCHA (contra el ahogo): el acumulado
  #      crece turno a turno, así que el último necesita la mayor ventana. Un
  #      modelo angosto al final recibe el máximo con el mínimo sitio.
  #
  # El criterio 2 manda porque su fallo es duro --- el contexto no entra y se
  # trunca en silencio --- mientras el del 1 es un sesgo, degradación suave.
  #
  #   3. CUANDO LOS DOS CHOCAN, SE COMPACTA; NO SE REORDENA NI SE TRUNCA.
  #      Medido el 2026-09-24, los dos criterios se contradicen en esta
  #      máquina: el modelo más FUERTE es el que MENOS ventana admite.
  #
  #        llama3.2:3b     (el débil)   admite 32.768
  #        deepseek-r1:8b  (el fuerte)  admite 12.288
  #
  #      Aplicar el criterio 2 al pie de la letra pondría al experto PRIMERO,
  #      que es justo maximizar el anclaje que el criterio 1 existe para
  #      evitar. La salida no es elegir uno: es DESTILAR el acumulado antes
  #      del último turno para que quepa en su ventana. Eso ya es lo que hacen
  #      `por_turno` y `acumulado_es_prioritario`; lo que faltaba era la razón
  #      medida de por qué son obligatorios y no una optimización.
  acumulado_es_prioritario: true
  reserva_para_generacion: 0.25   # del total de la ventana

# ---------------------------------------------------------------------------
# RECUPERACIÓN VECTORIAL (sustituye al pack fijo de 12.000 chars)
# ---------------------------------------------------------------------------
vectorial:
  habilitado: false             # se activa cuando el índice esté construido
  modelo_embeddings: nomic-embed-text   # 768 dimensiones, vía /api/embed
  indice: data/indice_vectorial.db      # sqlite3, sin dependencias externas
  fragmentos_por_consulta: 8
  chars_por_fragmento: 1200

# ---------------------------------------------------------------------------
# MÁXIMO — solo con Sentinel Omega DETENIDO. Nunca se elige automáticamente.
# ---------------------------------------------------------------------------
# deepseek-r1:14b QUEDA FUERA DE ESTA MÁQUINA. No es «pide 9,0 G y hay 7,9»,
# como decía la versión anterior de esta nota: ese 9,0 era el PESO y ese 7,9
# venía de `free` de WSL, que no ve el host. Medido de verdad:
#
#   deepseek-r1:14b   peso 8,37 GiB
#     @131.072  34,0 GiB      @16.384  11,9 GiB      @4.096   9,6 GiB
#     @2.048     9,2 GiB   <-- lo único que «cabe», y sólo con Sentinel parado
#
# Un 14b con ventana de 2.048 no sirve para nada de lo que hace el Concilio:
# el pack de memoria solo no entra. Y 9,2 de 11,71 GiB deja 0,5 libres con
# Windows encima --- cualquier pico va a disco. Así que este perfil NO monta el
# 14b. Lo dejo escrito en vez de borrarlo porque la conclusión importa: el
# modelo está descargado y no se puede usar; ocupa 8,37 GiB de disco por nada.
#
# EL MÁXIMO REAL de esta máquina es lo mismo de siempre con VENTANAS MÁS
# ANCHAS. Detener Sentinel libera los 1,95 GiB de WSL y sube el techo por
# modelo de 6,8 a ~9,2 GiB, que es lo que aprovechan estos turnos.
maximo:
  requiere_sentinel_detenido: true
  # Por qué no hay 14b aquí: ver la nota de arriba. Medido, no supuesto.
  investigacion:
    turnos:
      - {model: llama3.2:3b,    rol: explorador, tools: readonly, ctx: 32768}
      - {model: mistral:7b,     rol: contrastador, tools: readonly, ctx: 32768}
      - {model: deepseek-r1:8b, rol: experto, tools: readonly, ctx: 24576}
  codigo:
    turnos:
      - {model: "qwen2.5-coder:7b", rol: programador, tools: readonly, ctx: 32768}
      - {model: deepseek-r1:8b,     rol: experto, tools: readonly, ctx: 24576}
