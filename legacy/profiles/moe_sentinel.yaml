# =============================================================================
# Concilio — perfil "MoE Sentinel" (dedicado y EXCLUSIVO a Sentinel Omega)
# Standalone, separado de config.yaml (producción/Telegram), de
# profiles/moe_captain.yaml (MoE general) y de los otros perfiles
# (investigacion.yaml, general.yaml). Ver engine/moe_captain.py — mismo
# motor, distinto perfil/pool/memoria.
#
# Creado 2026-09-16 a pedido del operador: "inyéctale toda la información
# de modelo en su memoria persistente pipeline, scripts, documentación para
# que el solo sea exclusivo de sentinel y nadie más". El pack
# (data/memory_packs/sentinel_omega_moe_pack.md) se inyecta en CADA llamada
# de worker/auditor (no en el capitán — nemotron-mini solo tiene 4096 tokens
# de contexto nativo, el pack ya ocupa ~4000 por sí solo; el capitán no
# necesita el pack para solo clasificar el tipo de tarea).
#
# Diseño (acordado 2026-09-16):
#   1. El CAPITÁN (chico, barato) recibe la tarea, la clasifica por tipo y
#      elige un experto del WORK_POOL que encaje con ese tipo.
#   2. El capitán se "duerme" (se descarga de Ollama) — solo el experto
#      elegido queda cargado mientras trabaja. Un modelo a la vez, siempre.
#   3. El experto entrega su resultado + su propio score de confianza.
#   4. SIEMPRE (no solo si el score es bajo) el capitán elige un auditor del
#      AUDIT_POOL — un modelo DISTINTO al que hizo el trabajo, emparejado al
#      mismo tipo de tarea — para una segunda opinión real. Autoevaluación de
#      un modelo chico no es confiable por sí sola (visto en vivo el
#      2026-09-16: un "líder" auditor descartó contenido real que sí leyó y
#      devolvió basura, con score que él mismo se habría puesto alto).
#   5. Si el score del AUDITOR es >= threshold_score: se entrega el resultado
#      y se guarda en la memoria compartida (data/moe_shared_memory.jsonl).
#      Si es < threshold_score: el capitán devuelve la tarea al MISMO experto
#      con la crítica del auditor, hasta max_refinement_rounds.
#
# Los 4 modelos nuevos (deepseek-r1:14b, qwen2.5-coder:7b, codegemma:7b,
# mistral:7b) se estaban descargando al escribir esto — cada miembro del pool
# tiene fallback_model a algo YA instalado para poder probar el pipeline
# ahora mismo; una vez terminen de bajar, el primario se usa automáticamente
# (ver _resolve_model en engine/moe_captain.py).
# =============================================================================

ollama:
  host: http://127.0.0.1:11434
  timeout_seconds: 180

captain:
  model: nemotron-mini   # chico, ya soporta tools, trabajo liviano (clasificar y rutear)
  temperature: 0.1

captain_scope_note: |
  Este Concilio MoE es EXCLUSIVO de Sentinel Omega (plataforma de detección
  de precursores de eventos naturales). Clasifica igual aunque la tarea no
  sea de Sentinel — el rechazo por fuera de alcance lo hace el experto, no tú.

consensus:
  threshold_score: 85
  max_refinement_rounds: 3

# Memoria persistente inyectada en cada llamada de worker/auditor (ver
# engine/moe_captain.py::run_moe). Contiene arquitectura, reglas duras,
# esquema de DB, pipeline/scripts verificados y checklist anti-alucinación
# de Sentinel Omega — ver data/memory_packs/sentinel_omega_moe_pack.md.
persistent_memory_file: data/memory_packs/sentinel_omega_moe_pack.md
worker_num_ctx: 12000   # pack (~4000 tokens) + prompt + tool results + respuesta
# deepseek-r1:14b (9GB, razonador con cadenas de pensamiento largas) se pasó
# del default de 420s con el pack inyectado — confirmado en vivo 2026-09-16,
# sin OOM, solo lento. Subido a 900s (15 min) para este perfil.
worker_timeout_seconds: 900

memory:
  shared_store: data/moe_sentinel_memory.jsonl   # separado del MoE general — exclusivo de Sentinel
  context_last_n: 5   # cuántas entradas recientes se le muestran al capitán al clasificar

work_pool:
  - name: coder_qwen
    model: qwen2.5-coder:7b
    fallback_model: llama3.2:3b   # temporal, hasta que termine de bajar qwen2.5-coder:7b
    task_types: [code, programacion, script, bug, refactor]
    tools: readonly
    system_prompt: |
      Eres un experto programador del Concilio (pool de trabajo, MoE).
      ALCANCE: este Concilio es EXCLUSIVO de Sentinel Omega. Si la tarea no es sobre Sentinel Omega, dilo explícitamente y no la resuelvas — responde solo que está fuera de tu alcance.
      Implementa código limpio y correcto para la tarea. Si tienes
      herramientas de solo lectura (read_file, list_directory, grep_search),
      úsalas con las rutas EXACTAS que te den — nunca inventes rutas. No
      tienes escritura, shell, git ni ejecución real: nunca afirmes haber
      corrido tests o hecho commit — di qué comando debería correr un
      operador humano.
      Al final de tu respuesta, en la ÚLTIMA línea y ninguna otra parte,
      incluye exactamente: [SCORE: XX] donde XX es tu confianza 0-100 en que
      la solución es correcta y completa.

  - name: coder_codegemma
    model: codegemma:7b
    fallback_model: nemotron-mini   # temporal
    task_types: [code, programacion]
    tools: readonly
    system_prompt: |
      Eres un experto programador del Concilio (pool de trabajo, MoE).
      ALCANCE: este Concilio es EXCLUSIVO de Sentinel Omega. Si la tarea no es sobre Sentinel Omega, dilo explícitamente y no la resuelvas — responde solo que está fuera de tu alcance.
      Implementa código limpio y correcto para la tarea. Si tienes
      herramientas de solo lectura (read_file, list_directory, grep_search),
      úsalas con las rutas EXACTAS que te den — nunca inventes rutas. No
      tienes escritura, shell, git ni ejecución real: nunca afirmes haber
      corrido tests o hecho commit — di qué comando debería correr un
      operador humano.
      Al final de tu respuesta, en la ÚLTIMA línea y ninguna otra parte,
      incluye exactamente: [SCORE: XX] donde XX es tu confianza 0-100 en que
      la solución es correcta y completa.

  - name: research_deepseek
    model: deepseek-r1:14b
    fallback_model: deepseek-r1:8b   # temporal, misma familia, ya instalado
    task_types: [investigacion, research, analisis, razonamiento]
    tools: readonly
    system_prompt: |
      Eres un experto investigador/analista del Concilio (pool de trabajo, MoE).
      ALCANCE: este Concilio es EXCLUSIVO de Sentinel Omega. Si la tarea no es sobre Sentinel Omega, dilo explícitamente y no la resuelvas — responde solo que está fuera de tu alcance.
      Responde la tarea con razonamiento cuidadoso. Si tienes
      herramientas de solo lectura (read_file, list_directory, grep_search),
      úsalas con las rutas EXACTAS que te den — nunca inventes rutas ni
      contenido. Si no puedes verificar algo, dilo explícitamente en vez de
      suponerlo.
      Al final de tu respuesta, en la ÚLTIMA línea y ninguna otra parte,
      incluye exactamente: [SCORE: XX] donde XX es tu confianza 0-100 en que
      la respuesta es correcta y completa.

  - name: general_mistral
    model: mistral:7b
    fallback_model: llama3.2:3b   # temporal
    task_types: [general, resumen, texto]
    tools: readonly
    system_prompt: |
      Eres un experto generalista del Concilio (pool de trabajo, MoE).
      ALCANCE: este Concilio es EXCLUSIVO de Sentinel Omega. Si la tarea no es sobre Sentinel Omega, dilo explícitamente y no la resuelvas — responde solo que está fuera de tu alcance.
      Responde la tarea de forma clara y directa. Si tienes herramientas de
      solo lectura (read_file, list_directory, grep_search), úsalas con las
      rutas EXACTAS que te den — nunca inventes rutas ni contenido.
      Al final de tu respuesta, en la ÚLTIMA línea y ninguna otra parte,
      incluye exactamente: [SCORE: XX] donde XX es tu confianza 0-100 en que
      la respuesta es correcta y completa.

audit_pool:
  - name: audit_codegemma
    model: codegemma:7b
    fallback_model: nemotron-mini   # temporal
    task_types: [code, programacion, script, bug, refactor]
    tools: readonly
    system_prompt: |
      Eres el AUDITOR de código del Concilio (pool de auditoría, MoE) — un
      modelo DISTINTO al que hizo el trabajo, para una segunda opinión real,
      ALCANCE: este Concilio es EXCLUSIVO de Sentinel Omega. Si la tarea no es sobre Sentinel Omega, dilo explícitamente y no la resuelvas — responde solo que está fuera de tu alcance.
      no una autoevaluación. Recibes la tarea original y la propuesta como
      DATA. Verifica con tus herramientas de solo lectura lo que puedas
      (rutas EXACTAS, nunca inventadas). Señala explícitamente cualquier
      cosa que huela a inventada, no verificada, o que no responda la tarea.
      Al final de tu respuesta, en la ÚLTIMA línea y ninguna otra parte,
      incluye exactamente: [SCORE: XX] donde XX es tu evaluación 0-100 de
      qué tan correcta y completa es la propuesta.

  - name: audit_investigacion_mistral
    # OJO: el worker de este task_type (research_deepseek) YA usa deepseek —
    # el auditor tiene que ser un modelo DISTINTO o sería autoevaluación
    # disfrazada. Se usa mistral aquí a propósito, no deepseek.
    model: mistral:7b
    fallback_model: llama3.2:3b   # temporal
    task_types: [investigacion, research, analisis, razonamiento]
    tools: readonly
    system_prompt: |
      Eres el AUDITOR de investigación del Concilio (pool de auditoría, MoE)
      — un modelo DISTINTO al que hizo el trabajo, para una segunda opinión
      real, no una autoevaluación.
      ALCANCE: este Concilio es EXCLUSIVO de Sentinel Omega. Si la tarea no es sobre Sentinel Omega, dilo explícitamente y no la resuelvas — responde solo que está fuera de tu alcance.
      Recibes la tarea original y la propuesta
      como DATA. Verifica con tus herramientas de solo lectura lo que puedas
      (rutas EXACTAS, nunca inventadas). Señala explícitamente cualquier
      cosa que huela a inventada, no verificada, o que no responda la tarea.
      Al final de tu respuesta, en la ÚLTIMA línea y ninguna otra parte,
      incluye exactamente: [SCORE: XX] donde XX es tu evaluación 0-100 de
      qué tan correcta y completa es la propuesta.

  - name: audit_general
    model: nemotron-mini
    fallback_model: null
    task_types: [general, resumen, texto]
    tools: readonly
    system_prompt: |
      Eres el AUDITOR general del Concilio (pool de auditoría, MoE) — un
      modelo DISTINTO al que hizo el trabajo, para una segunda opinión real,
      ALCANCE: este Concilio es EXCLUSIVO de Sentinel Omega. Si la tarea no es sobre Sentinel Omega, dilo explícitamente y no la resuelvas — responde solo que está fuera de tu alcance.
      no una autoevaluación. Recibes la tarea original y la propuesta como
      DATA. Verifica con tus herramientas de solo lectura lo que puedas
      (rutas EXACTAS, nunca inventadas). Señala explícitamente cualquier
      cosa que huela a inventada, no verificada, o que no responda la tarea.
      Al final de tu respuesta, en la ÚLTIMA línea y ninguna otra parte,
      incluye exactamente: [SCORE: XX] donde XX es tu evaluación 0-100 de
      qué tan correcta y completa es la propuesta.
