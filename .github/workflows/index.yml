name: index

# Verifica que el README (documento curado a mano) siga reflejando las ramas de
# sistema reales del remoto. No reescribe el README: solo falla si aparece o
# desaparece una rama `local/*` sin actualizar la documentacion.
#
#   - create / push a main / pull_request / diario / manual -> corre --check
#
# El evento `create` corre con el workflow de la rama por defecto (main), asi que
# crear una rama huerfana local/* dispara la verificacion aunque esa rama no tenga
# este archivo.

on:
  create:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC diario
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar que el indice del README esta al dia
        run: python3 tools/gen_index.py --check

      - name: Subir log como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen_index-log
          path: logs/gen_index.log
          if-no-files-found: ignore
